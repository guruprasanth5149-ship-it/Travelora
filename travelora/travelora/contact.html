<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Travelora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-page="contact">
<!-- Header, footer, loader and modals are injected by js/script.js -->
<section class="hero short" data-seed="sunset-plane"><div class="hero-bg"></div><div class="sky"></div>
<div class="hero-in"><h1>LET'S PLAN YOUR TRIP</h1><p class="reveal">Tell us where you want to go. We will do the rest.</p></div></section>
<section class="wrap split2"><form class="card pad reveal" id="contactForm"><div class="f"><input required placeholder=" "><label>Name</label></div><div class="f"><input required type="email" placeholder=" "><label>Email</label></div><div class="f"><input required placeholder=" "><label>Phone</label></div><div class="f"><input placeholder=" "><label>Destination</label></div><div class="f"><input type="date"><label class="up">Travel date</label></div><div class="f"><input type="number" min="1" placeholder=" "><label>Number of travelers</label></div><div class="f"><textarea rows="3" placeholder=" "></textarea><label>Message</label></div><button class="btn gold">Send enquiry <i>→</i></button></form>
<div class="reveal"><h2>Reach us</h2><p>Phone: +91 98765 43210</p><p>Email: hello@travelora.example</p><p>Office: 12 Marina Road, Chennai, India</p><p>Support: open 24/7 for travellers on the road</p></div></section>
<script src="js/script.js"></script></body></html>
